name: Frontend deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [deploy, rollback]
        default: deploy
      release_run_id:
        description: Successful main frontend deployment run whose artifact will be restored
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.operation != 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate and build exact trusted frontend commit
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - run: node infra/scripts/frontend-release.mjs manifest frontend/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-static
          path: frontend/dist
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' || inputs.operation == 'rollback')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: assignment
    concurrency:
      group: weather-production-mutation
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      FRONTEND_STORAGE_ACCOUNT: ${{ vars.FRONTEND_STORAGE_ACCOUNT }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      - name: Verify retained artifact provenance for rollback
        if: inputs.operation == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > "$RUNNER_TEMP/frontend-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/frontend-jobs.json"
          node --input-type=module -e "
            import fs from 'node:fs';
            const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/frontend-run.json'));
            if (run.head_branch !== 'main' || run.conclusion !== 'success' ||
                !['.github/workflows/frontend-deploy.yml', '.github/workflows/production.yml'].includes(run.path) ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                run.repository.full_name !== process.env.GITHUB_REPOSITORY) {
              throw new Error('Untrusted or unsuccessful frontend rollback artifact');
            }
            const jobs = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/frontend-jobs.json')).jobs;
            const deployJob = run.path === '.github/workflows/production.yml' ? 'deploy' : 'release';
            if (!jobs.some(job => job.name === deployJob && job.conclusion === 'success')) {
              throw new Error('Artifact did not complete a production deployment');
            }"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-static
          path: static-release
          run-id: ${{ inputs.operation == 'rollback' && inputs.release_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish assets first, switch index last and validate canonical routes
        run: node infra/scripts/frontend-release.mjs publish static-release
